services:
  hub:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HUB_HOST: "0.0.0.0"
      HUB_PORT: "8787"
      HUB_DATA_DIR: "/app/data"
      HUB_EXTERNAL_USER_HEADER: "${HUB_EXTERNAL_USER_HEADER:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      EDC_MANAGEMENT_URL: "${EDC_MANAGEMENT_URL:-}"
      EDC_API_KEY: "${EDC_API_KEY:-}"
      EDC_PROVIDER_URL: "${EDC_PROVIDER_URL:-}"
      EDC_PARTICIPANT_ID: "${EDC_PARTICIPANT_ID:-}"
      EDC_PROTOCOL: "${EDC_PROTOCOL:-dataspace-protocol-http}"
      EDC_DATA_HOSTS: "${EDC_DATA_HOSTS:-}"
      HUB_DCAT_URL: "${HUB_DCAT_URL:-}"
      HUB_DCAT_DATA_HOSTS: "${HUB_DCAT_DATA_HOSTS:-}"
    volumes:
      - hub_data:/app/data
    restart: unless-stopped
volumes:
  hub_data:
